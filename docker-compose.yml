# Local PostgreSQL for the Ọbaifo API. Start with: docker compose up -d
# Port 5544 avoids clashing with other Postgres servers on 5432/5433.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agumagu
      POSTGRES_PASSWORD: agumagu
      POSTGRES_DB: agumagu
    ports:
      - "5544:5432"
    volumes:
      - agumagu-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agumagu -d agumagu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agumagu-db:
